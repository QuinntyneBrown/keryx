<div
  class="segmented"
  [attr.role]="label() ? 'group' : null"
  [attr.aria-label]="label() ?? null"
  [attr.aria-disabled]="disabled() && options().length ? 'true' : null"
>
  @for (option of options(); track option.href) {
    <a
      class="segmented__option"
      [href]="option.href"
      [attr.aria-current]="option.current ? 'true' : null"
      (click)="follow($event, option.href)"
      >{{ option.label }}</a
    >
  }
  @for (choice of choices(); track choice.value) {
    <button
      class="segmented__option"
      type="button"
      [attr.aria-pressed]="choice.value === value() ? 'true' : 'false'"
      [disabled]="disabled()"
      (click)="choose.emit(choice.value)"
    >
      {{ choice.label }}
    </button>
  }
</div>
