<div class="field">
  @if (for(); as control) {
    <label class="field__label" [attr.for]="control">{{ label() }}</label>
  } @else {
    <span class="field__label">{{ label() }}</span>
  }
  <ng-content />
  @if (error(); as error) {
    <p class="field__error" [attr.id]="errorId() ?? null">
      <kx-icon name="warning" size="sm" />{{ error }}
    </p>
  }
  @if (help(); as help) {
    <p class="field__help" [attr.id]="helpId() ?? null">{{ help }}</p>
  }
</div>
