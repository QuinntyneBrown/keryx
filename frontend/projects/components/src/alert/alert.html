<div [attr.class]="'alert alert--' + tone()" [attr.role]="announcement() ?? null">
  <kx-icon
    class="alert__icon"
    [name]="
      tone() === 'success'
        ? 'success'
        : tone() === 'danger' || tone() === 'warning'
          ? 'warning'
          : 'info'
    "
  />
  <div class="alert__body">
    @if (title(); as title) {
      <p class="alert__title">{{ title }}</p>
    }
    <ng-content />
    <div class="alert__actions"><ng-content select="[slot=actions]" /></div>
  </div>
</div>
