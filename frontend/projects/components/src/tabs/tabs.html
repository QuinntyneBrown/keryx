<div class="tabs" role="tablist" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id; let index = $index) {
    <button
      class="tab"
      type="button"
      role="tab"
      [id]="'tab-' + tab.id"
      [attr.aria-selected]="tab.id === selected() ? 'true' : 'false'"
      [attr.aria-controls]="panelId()"
      [attr.tabindex]="tab.id === selected() ? 0 : -1"
      (click)="choose(tab.id)"
      (keydown)="move($event, index)"
    >
      {{ tab.label }}
      @if (tab.count !== undefined) {
        <kx-badge count [tone]="tab.countTone ?? 'neutral'">{{ tab.count }}</kx-badge>
      }
    </button>
  }
</div>
