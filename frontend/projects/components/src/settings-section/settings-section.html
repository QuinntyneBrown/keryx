@if (placeholder()) {
  <div class="settings-section">
    <div><kx-skeleton shape="title" [width]="60" /><kx-skeleton /></div>
    <div class="settings-section__fields">
      <div><kx-skeleton [width]="20" /><kx-skeleton shape="title" [width]="80" /></div>
      <div><kx-skeleton [width]="30" /><kx-skeleton shape="title" [width]="40" /></div>
    </div>
  </div>
} @else {
  <section class="settings-section" [attr.aria-labelledby]="headingId">
    <div>
      <h2 class="text-h3" [id]="headingId">{{ title() }}</h2>
      @if (hint(); as hint) {
        <p class="settings-section__hint">{{ hint }}</p>
      }
    </div>
    <div class="settings-section__fields"><ng-content /></div>
  </section>
}
