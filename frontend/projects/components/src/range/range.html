<div class="range">
  <input
    type="range"
    [id]="controlId()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [attr.aria-describedby]="describedBy() ?? null"
    [disabled]="disabled()"
    (input)="update($event)"
  /><output class="range__value" [attr.for]="controlId()">{{ written() }}</output>
</div>
