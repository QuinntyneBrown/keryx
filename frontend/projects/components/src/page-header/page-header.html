<header class="page-header">
  <div class="page-header__text">
    <h1>{{ title() }}</h1>
    @if (description(); as description) {
      <p class="page-header__description">{{ description }}</p>
    }
  </div>
  <div class="page-header__actions"><ng-content select="[slot=actions]" /></div>
</header>
