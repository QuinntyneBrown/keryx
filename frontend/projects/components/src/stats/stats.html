<dl class="stats">
  @for (item of items(); track item.label) {
    <div class="stat">
      <dt class="stat__label">{{ item.label }}</dt>
      <!-- prettier-ignore -->
      <dd [attr.class]="'stat__value stat__value--' + (item.size ?? 'lg')">{{ item.value }}@if (item.unit) {<span class="stat__unit">{{ item.unit }}</span>}</dd>
      @if (item.sub) {
        <dd class="stat__sub">{{ item.sub }}</dd>
      }
    </div>
  }
</dl>
