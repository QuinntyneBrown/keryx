@if (loading()) {
  <!-- Each line holds a no-break space, so it is as tall as the line it stands for. -->
  <div [attr.class]="classes()">
    @for (item of items(); track item.label) {
      <div class="stat">
        <p class="stat__label stat__placeholder"><kx-skeleton [width]="60" />&nbsp;</p>
        <p [attr.class]="valueClasses(item) + ' stat__placeholder'">
          <kx-skeleton shape="stat" />&nbsp;
        </p>
        @if (item.sub !== undefined) {
          <p class="stat__sub stat__placeholder"><kx-skeleton [width]="40" />&nbsp;</p>
        }
      </div>
    }
  </div>
} @else {
  <dl [attr.class]="classes()">
    @for (item of items(); track item.label) {
      <div class="stat">
        <dt class="stat__label">{{ item.label }}</dt>
        <!-- prettier-ignore -->
        <dd [attr.class]="valueClasses(item)">{{ item.value }}@if (item.unit) {<span class="stat__unit">{{ item.unit }}</span>}</dd>
        @if (item.sub) {
          <dd class="stat__sub">{{ item.sub }}</dd>
        }
      </div>
    }
  </dl>
}
