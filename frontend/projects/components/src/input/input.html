<input
  [attr.class]="
    'input' +
    (mono() ? ' input--mono' : '') +
    (iconStart() ? ' input--icon-start' : '') +
    (width() ? ' input--' + width() : '')
  "
  [id]="controlId()"
  [type]="type()"
  [attr.inputmode]="inputmode() ?? null"
  [attr.autocomplete]="autocomplete()"
  [attr.placeholder]="placeholder() ?? null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="describedBy() ?? null"
  [disabled]="disabled()"
  [value]="value()"
  (input)="update($event)"
  (blur)="left.emit()"
/>
