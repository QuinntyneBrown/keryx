<kx-page-header
  title="Articles"
  description="Everything Keryx has collected. Only published articles are served by the API."
/>
<kx-page-body>
  <kx-tabs
    label="Article status"
    panelId="articles-panel"
    [tabs]="tabs()"
    [selected]="tabId()"
    (selectedChange)="chooseTab($event)"
  />
  <kx-toolbar class="articles__toolbar">
    <kx-search
      #search
      controlId="article-search"
      label="Search articles"
      placeholder="Search titles, organisations, places"
      [value]="query().q"
      (valueChange)="typed($event)"
    />
    <label class="visually-hidden" for="filter-region">Region</label>
    <kx-select
      auto
      controlId="filter-region"
      placeholder="All regions"
      [options]="regionOptions()"
      [value]="query().region ?? ''"
      (valueChange)="filter({ region: $event })"
    />
    <label class="visually-hidden" for="filter-category">Category</label>
    <kx-select
      auto
      controlId="filter-category"
      placeholder="All categories"
      [options]="categoryOptions"
      [value]="query().category ?? ''"
      (valueChange)="filter({ category: $event })"
    />
  </kx-toolbar>
  <div
    class="articles__panel"
    id="articles-panel"
    role="tabpanel"
    [attr.aria-labelledby]="'tab-' + tabId()"
  >
    @if (noResults(); as words) {
      <kx-empty card compact [title]="words.title" [text]="words.text">
        <kx-icon slot="icon" name="search" size="lg" />
        <kx-btn slot="actions" (activated)="clear(search)">{{ words.action }}</kx-btn>
      </kx-empty>
    } @else if (store.page(); as page) {
      <kx-table
        #table
        caption="Articles, newest first"
        [columns]="columns"
        [rows]="rows()"
        [rowKey]="rowKey"
        [cells]="{
          article: articleCell,
          category: categoryCell,
          region: regionCell,
          relevance: relevanceCell,
          status: statusCell,
        }"
      >
        <ng-template #articleCell let-row>
          <span class="articles__title table__title" dir="auto">{{ row.title }}</span>
          <span class="articles__sub table__sub">{{ row.sub }}</span>
          <span class="articles__stacked table__stacked until-lg"
            ><kx-badge dot [tone]="row.tone ?? 'neutral'">{{ row.status }}</kx-badge
            ><span class="text-caption">{{ row.place }}</span></span
          >
        </ng-template>
        <ng-template #categoryCell let-row>{{ row.category }}</ng-template>
        <ng-template #regionCell let-row>{{ row.region }}</ng-template>
        <ng-template #relevanceCell let-row>
          <kx-meter [value]="row.item.relevance" [text]="row.relevance" [tone]="row.tone" />
        </ng-template>
        <ng-template #statusCell let-row>
          <kx-badge dot [tone]="row.tone ?? 'neutral'">{{ row.status }}</kx-badge>
        </ng-template>
      </kx-table>
      <kx-pagination
        [range]="range()"
        [hasPrevious]="page.page > 1"
        [hasNext]="hasNext()"
        (step)="step($event, table)"
      />
    }
  </div>
</kx-page-body>
