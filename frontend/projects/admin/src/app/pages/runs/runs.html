<kx-page-header title="Runs" [description]="description()" />
<kx-page-body>
  <kx-rail start>
    <section aria-label="Run history">
      <kx-list [runs]="runs()" (navigate)="navigate($event)" />
    </section>
    @if (detail(); as shown) {
      <section aria-labelledby="run-title">
        <kx-card
          headingId="run-title"
          [heading]="shown.heading"
          [badge]="shown.badge"
          [reference]="shown.reference"
          [meta]="shown.meta"
        >
          <kx-stats four ruled [items]="shown.tiles" />
        </kx-card>
      </section>
    }
  </kx-rail>
</kx-page-body>
