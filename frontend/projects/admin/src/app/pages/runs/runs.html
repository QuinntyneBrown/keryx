<kx-page-header title="Runs" [description]="description()" />
<kx-page-body>
  <kx-rail start>
    <section aria-label="Run history">
      <kx-segmented
        class="runs__filter"
        label="Filter runs"
        [options]="filters()"
        (navigate)="navigate($event)"
      />
      @if (store.page(); as page) {
        @if (page.items.length) {
          <kx-list [runs]="runs()" (navigate)="navigate($event)" />
        } @else {
          <kx-empty
            card
            compact
            tone="success"
            title="No runs with problems"
            text="Every run Keryx has on record finished cleanly."
          >
            <kx-icon slot="icon" name="success" size="lg" />
            <kx-btn slot="actions" href="/runs" (navigate)="navigate($event)">Show all runs</kx-btn>
          </kx-empty>
        }
      }
    </section>
    @if (detail(); as shown) {
      <section aria-labelledby="run-title">
        <kx-stack gap="lg">
          <kx-card
            headingId="run-title"
            [heading]="shown.heading"
            [badge]="shown.badge"
            [reference]="shown.reference"
            [meta]="shown.meta"
          >
            <kx-stats four ruled [items]="shown.tiles" />
          </kx-card>
          <section aria-labelledby="pipeline-title">
            <h3 id="pipeline-title" class="runs__section-title">Pipeline</h3>
            <kx-timeline [steps]="shown.steps" />
          </section>
          <section aria-labelledby="issues-title">
            <h3 id="issues-title" class="runs__section-title">Issues in this run</h3>
            @if (shown.issues.length) {
              <kx-list [issues]="shown.issues" />
            } @else {
              <kx-empty
                card
                compact
                tone="success"
                [level]="4"
                title="No issues in this run"
                text="Every source responded and nothing was held for review."
              >
                <kx-icon slot="icon" name="success" size="lg" />
              </kx-empty>
            }
          </section>
        </kx-stack>
      </section>
    } @else if (store.page()?.items?.length === 0) {
      <kx-empty
        title="Choose a run"
        text="Pick a run from the list to see its pipeline steps and issues."
      >
        <kx-icon slot="icon" name="runs" size="lg" />
      </kx-empty>
    }
  </kx-rail>
</kx-page-body>
