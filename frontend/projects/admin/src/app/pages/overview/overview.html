<kx-page-header
  title="Overview"
  description="Christian fitness news collected across Toronto & the GTA."
/>
<kx-page-body>
  @if (card(); as shown) {
    <kx-status-card
      [eyebrow]="shown.eyebrow"
      [headline]="shown.headline"
      [meta]="shown.meta"
      [reference]="shown.reference"
      [tone]="shown.tone"
      [stats]="shown.stats"
      historyCaption="New articles per run · last 14 runs"
    >
      @if (bars(); as shownBars) {
        <kx-run-chart [bars]="shownBars" />
      }
    </kx-status-card>
  }
</kx-page-body>
