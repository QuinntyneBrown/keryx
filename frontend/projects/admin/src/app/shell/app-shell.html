<kx-skip-link />
<kx-app>
  <kx-sidebar slot="sidebar" [userName]="staff()?.name" [userRole]="staff()?.role">
    <kx-brand slot="brand" href="/" label="Keryx, go to overview" (navigate)="navigate($event)" />
    <kx-nav-link href="/sources" [current]="isCurrent('/sources')" (navigate)="navigate($event)">
      <kx-icon slot="icon" name="rss" size="sm" />Sources
    </kx-nav-link>
    <kx-nav-link href="/api" [current]="isCurrent('/api')" (navigate)="navigate($event)">
      <kx-icon slot="icon" name="key" size="sm" />API
    </kx-nav-link>
    <kx-nav-link href="/settings" [current]="isCurrent('/settings')" (navigate)="navigate($event)">
      <kx-icon slot="icon" name="settings" size="sm" />Settings
    </kx-nav-link>
    @if (staff(); as person) {
      <kx-avatar slot="avatar" [initials]="person.initials" />
    }
  </kx-sidebar>
  <router-outlet />
</kx-app>
<kx-toast-region>
  @for (shown of notifier.notices(); track shown.key) {
    <kx-toast
      [tone]="shown.notice.tone"
      [title]="shown.notice.title"
      [text]="shown.notice.text"
      [actionLabel]="shown.notice.action?.label"
      (acted)="notifier.act(shown)"
      (dismiss)="notifier.dismiss(shown.key)"
    />
  }
</kx-toast-region>
