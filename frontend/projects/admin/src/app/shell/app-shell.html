<kx-skip-link />
<kx-app>
  <kx-sidebar
    slot="sidebar"
    [navigation]="false"
    [userName]="staff()?.name"
    [userRole]="staff()?.role"
  >
    <kx-brand slot="brand" href="/" label="Keryx, go to overview" (navigate)="navigate($event)" />
    @if (staff(); as person) {
      <kx-avatar slot="avatar" [initials]="person.initials" />
    }
  </kx-sidebar>
  <kx-page-body centered>
    <router-outlet />
  </kx-page-body>
</kx-app>
